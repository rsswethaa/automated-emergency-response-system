name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check app.py detector.py tests

      - name: Type-check detector
        run: mypy detector.py

      - name: Run pytest with branch coverage
        run: pytest --cov=app --cov=detector --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Compile Python
        run: python -m compileall app.py detector.py tests

      - name: Build container
        run: docker build -t automated-emergency-response-system:ci .
